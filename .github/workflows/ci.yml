name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          UPSTASH_REDIS_REST_URL: https://example.invalid
          UPSTASH_REDIS_REST_TOKEN: build-placeholder
          SROUTER_VAULT_ID: ci
          SROUTER_INSTANCE_ID: ci
          NEXT_PUBLIC_APP_URL: https://example.invalid
          OAUTH_STATE_SECRET: ci-placeholder-secret-at-least-32-characters
